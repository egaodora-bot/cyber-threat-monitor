<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPAN CYBER THREAT MONITOR</title>
    <style>
        body {
            margin: 0;
            background-color: #020617;
            color: #38bdf8;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #svg-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
            pointer-events: none;
        }
        .land {
            fill: #091e3a;
            stroke: #0ea5e9;
            stroke-width: 1;
        }
        .map-label {
            fill: #94a3b8;
            font-size: 13px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            letter-spacing: 1px;
        }
        .target-label {
            fill: #ef4444;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }

        /* ダッシュボード（左上） */
        .hud-main {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #0ea5e9;
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.3);
            z-index: 10;
            width: 340px;
        }
        h1 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #f8fafc;
        }
        .subtitle {
            font-size: 11px;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .stat-label {
            font-size: 11px;
            color: #94a3b8;
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
        }
        .log-box {
            font-size: 11px;
            color: #cbd5e1;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid #1e293b;
            padding: 8px;
            border-radius: 6px;
            height: 50px;
            overflow: hidden;
            line-height: 1.4;
        }

        /* 解説パネル（左下） */
        .legend-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #0ea5e9;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
            z-index: 10;
            width: 340px;
        }
        .legend-title {
            font-size: 12px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 8px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 4px;
        }
        .legend-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
            font-size: 11px;
            color: #cbd5e1;
        }
        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .legend-desc {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 1px;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 安定動作する高精度SVG世界地図 -->
    <svg id="svg-map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
        <g stroke="#0c2a4a" stroke-width="0.5">
            <line x1="0" y1="125" x2="1000" y2="125" stroke-dasharray="3" />
            <line x1="0" y1="250" x2="1000" y2="250" stroke-dasharray="3" />
            <line x1="0" y1="375" x2="1000" y2="375" stroke-dasharray="3" />
            <line x1="250" y1="0" x2="250" y2="500" stroke-dasharray="3" />
            <line x1="500" y1="0" x2="500" y2="500" stroke-dasharray="3" />
            <line x1="750" y1="0" x2="750" y2="500" stroke-dasharray="3" />
        </g>

        <!-- 各大陸のシルエット -->
        <g class="land">
            <!-- 北米 -->
            <path d="M130,80 C150,60 190,55 220,65 C250,75 270,60 290,75 C310,90 295,120 310,140 C325,160 300,185 285,165 C270,145 250,170 235,190 C220,210 190,200 175,180 C160,160 135,175 120,150 C105,125 115,100 130,80 Z" />
            <!-- 南米 -->
            <path d="M220,250 C240,240 270,250 285,280 C300,310 280,365 260,410 C240,455 215,445 205,400 C195,355 190,305 205,270 C210,258 215,252 220,250 Z" />
            <!-- ヨーロッパ -->
            <path d="M470,90 C490,75 520,70 550,85 C570,95 560,130 535,145 C510,160 480,140 465,120 C455,105 460,95 470,90 Z" />
            <!-- アフリカ -->
            <path d="M470,160 C510,150 540,165 560,195 C580,225 560,290 545,340 C530,390 500,400 480,360 C460,310 445,225 455,190 C460,175 465,165 470,160 Z" />
            <!-- アジア・中国・ロシア -->
            <path d="M540,50 C630,30 730,35 840,50 C910,65 950,105 930,150 C910,195 840,185 800,160 C760,190 700,170 650,195 C600,220 560,170 545,130 C535,100 530,70 540,50 Z" />
            <!-- オーストラリア -->
            <path d="M790,340 C840,330 890,340 900,380 C910,420 870,450 820,445 C780,440 770,390 780,360 C785,345 788,342 790,340 Z" />
            <!-- 日本（東京・ターゲット） -->
            <path id="japan-map" d="M868,132 C876,128 884,138 881,152 C877,165 868,172 862,162 C858,150 862,135 868,132 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        </g>

        <!-- 国名・地域ラベル -->
        <text x="175" y="115" class="map-label">アメリカ (北米)</text>
        <text x="220" y="340" class="map-label">南米</text>
        <text x="485" y="115" class="map-label">ヨーロッパ</text>
        <text x="485" y="260" class="map-label">アフリカ</text>
        <text x="670" y="95" class="map-label">アジア / 中国 / ロシア</text>
        <text x="810" y="415" class="map-label">オーストラリア</text>

        <!-- 東京ターゲットラベルと引き出し線 -->
        <text x="830" y="105" class="target-label">🇯🇵 日本 (東京)</text>
        <line x1="890" y1="115" x2="905" y2="140" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="905" cy="140" r="4.5" fill="#ef4444" />
    </svg>

    <canvas id="canvas"></canvas>

    <!-- ダッシュボード -->
    <div class="hud-main">
        <h1>🇯🇵 日本サイバー攻撃 ライブ監視</h1>
        <div class="subtitle">海外から日本へ向かうサイバー攻撃の可視化</div>
        
        <div class="stats-row">
            <div class="stat-label">これまでの検知数</div>
            <div id="count-total" class="stat-value">0</div>
        </div>

        <div class="stat-label" style="margin-bottom: 3px;">いま起きている攻撃:</div>
        <div id="log" class="log-box">システム稼働中... ネットワークを監視しています。</div>
    </div>

    <!-- 初心者向け解説パネル -->
    <div class="legend-panel">
        <div class="legend-title">📖 攻撃の種類の見方</div>
        
        <div class="legend-item">
            <div class="color-dot" style="background: #38bdf8; box-shadow: 0 0 6px #38bdf8;"></div>
            <div>
                <b>🔵 青い光：不正アクセスの下見（スキャン）</b>
                <div class="legend-desc">サーバーの隙を探してパトロールしている状態</div>
            </div>
        </div>

        <div class="legend-item">
            <div class="color-dot" style="background: #ef4444; box-shadow: 0 0 6px #ef4444;"></div>
            <div>
                <b>🔴 赤い光：サーバーをパンクさせる攻撃（高負荷）</b>
                <div class="legend-desc">大量データを送りつけてダウンさせようとする危険な攻撃</div>
            </div>
        </div>

        <div class="legend-item">
            <div class="color-dot" style="background: #ffffff; box-shadow: 0 0 6px #ffffff;"></div>
            <div>
                <b>⚪ 白い光：生存確認（呼びかけ）</b>
                <div class="legend-desc">「そこにパソコンはあるか？」と返事を探る信号</div>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
const countTotalEl = document.getElementById('count-total');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 東京の位置（SVGマップ上の正確な座標に対応）
const targetJapan = { x: 0.905, y: 0.28 };

const sources = [
    { x: 0.21, y: 0.28, name: "アメリカ（北米）" },
    { x: 0.28, y: 0.32, name: "アメリカ（東海岸）" },
    { x: 0.51, y: 0.22, name: "ヨーロッパ" },
    { x: 0.54, y: 0.48, name: "アフリカ" },
    { x: 0.74, y: 0.20, name: "アジア / 中国" },
    { x: 0.83, y: 0.78, name: "オーストラリア" },
    { x: 0.25, y: 0.65, name: "南米" }
];

const attackTypes = [
    { name: "不正アクセスの下見（ポートスキャン）", color: "#38bdf8" },
    { name: "サーバーを壊す大量送信（DDoS攻撃）", color: "#ef4444" },
    { name: "存在確認の呼びかけ（Ping）", color: "#ffffff" }
];

let activePackets = [];
let totalPacketsCount = 0;

function spawnPacket() {
    const src = sources[Math.floor(Math.random() * sources.length)];
    const attack = attackTypes[Math.floor(Math.random() * attackTypes.length)];
    
    activePackets.push({
        sx: src.x * canvas.width,
        sy: src.y * canvas.height,
        tx: targetJapan.x * canvas.width,
        ty: targetJapan.y * canvas.height,
        progress: 0,
        speed: 0.005 + Math.random() * 0.006,
        color: attack.color,
        attackName: attack.name,
        sourceName: src.name
    });

    totalPacketsCount++;
    countTotalEl.innerText = totalPacketsCount.toLocaleString();

    logEl.innerHTML = `<b>【${src.name}】</b>から攻撃を検知！<br><span style="color:${attack.color}">➔ ${attack.attackName}</span>`;
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const tx = targetJapan.x * canvas.width;
    const ty = targetJapan.y * canvas.height;
    
    // 東京の波紋エフェクト
    ctx.beginPath();
    ctx.arc(tx, ty, 14 + (Date.now() / 25) % 30, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    for (let i = activePackets.length - 1; i >= 0; i--) {
        const p = activePackets[i];
        p.progress += p.speed;

        const curX = p.sx + (p.tx - p.sx) * p.progress;
        const arcHeight = Math.sin(p.progress * Math.PI) * -100;
        const curY = p.sy + (p.ty - p.sy) * p.progress + arcHeight;

        ctx.beginPath();
        ctx.arc(curX, curY, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();

        if (p.progress >= 1) {
            activePackets.splice(i, 1);
        }
    }
    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

setInterval(spawnPacket, 650);
animate();
</script>
</body>
</html>
