<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPAN CYBER THREAT MONITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #0b1120;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #svg-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.65;
            pointer-events: none;
        }
        .land {
            fill: #1e293b;
            stroke: #38bdf8;
            stroke-width: 0.8;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }

        /* メイン・コントロールパネル（左上） */
        .hud-main {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 10;
            width: 380px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 8px;
        }
        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
        }

        /* 脅威メーター（グラフ）セクション */
        .threat-graph-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
        .graph-title {
            font-size: 11px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .bar-wrapper {
            margin-bottom: 8px;
        }
        .bar-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .bar-track {
            background: #0f172a;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }
        .bar-progress {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .log-display {
            font-size: 12px;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 10px;
            border-radius: 6px;
            height: 44px;
            overflow: hidden;
            line-height: 1.4;
        }

        /* 解説パネル（左下） */
        .legend-card {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 10;
            width: 380px;
        }
        .legend-header {
            font-size: 12px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }
        .legend-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 4px;
            flex-shrink: 0;
        }
        .legend-text b {
            color: #f8fafc;
            display: block;
            margin-bottom: 1px;
        }
        .legend-text span {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 世界地図SVG -->
    <svg id="svg-map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
        <g
