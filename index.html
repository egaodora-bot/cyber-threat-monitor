<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPAN CYBER DEFENSE DASHBOARD</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }

        /* 左上：メインステータス */
        .hud-main {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(8, 15, 30, 0.95);
            border: 1px solid #1e3a8a;
            border-left: 4px solid #ef4444;
            padding: 14px;
            border-radius: 6px;
            z-index: 10;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 {
            margin: 0 0 4px 0;
            font-size: 13px;
            color: #f8fafc;
        }
        .subtitle {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .stat-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e293b;
            padding: 6px 8px;
            border-radius: 4px;
        }
        .stat-label {
            font-size: 9px;
            color: #64748b;
        }
        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #f8fafc;
        }
        .log-box {
            font-size: 10px;
            color: #cbd5e1;
            background: #020617;
            border: 1px solid #1e293b;
            padding: 6px;
            border-radius: 4px;
            height: 36px;
            overflow: hidden;
            line-height: 1.3;
        }

        /* 左下：凡例・ガイド */
        .explanation-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(8, 15, 30, 0.95);
            border: 1px solid #1e3a8a;
            padding: 12px;
            border-radius: 6px;
            z-index: 10;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .exp-title {
            font-size: 10px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 6px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 4px;
        }
        .exp-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 10px;
            color: #94a3b8;
        }
        .exp-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ノード用オーバーレイテキストラベル */
        .node-label-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .node-tag {
            position: absolute;
            transform: translateY(-50%);
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }
        .tag-source {
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.7);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #334155;
        }
        .tag-target {
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.85);
            padding: 4px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="container">
    <canvas id="canvas"></canvas>

    <!-- ダッシュボードパネル -->
    <div class="hud-main">
        <h1>🇯🇵 日本サイバー防衛・国別監視</h1>
        <div class="subtitle">国別攻撃元 ➔ 日本拠点へのリアルタイム攻防</div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">総検知数</div>
                <div id="count-total" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">自動ブロック数</div>
                <div id="count-blocked" class="stat-value" style="color: #10b981;">0</div>
            </div>
        </div>

        <div class="stat-label" style="margin-bottom: 2px;">最新の検知ログ:</div>
        <div id="log" class="log-box">防衛システム監視中...</div>
    </div>

    <!-- 画面ガイド -->
    <div class="explanation-panel">
        <div class="exp-title">🛡️ 攻撃と反撃（遮断）シグナルの見方</div>
        <div class="exp-row">
            <div class="exp-dot" style="background: #ef4444;"></div>
            <span><b>赤（右方向）：</b> サーバー破壊・DDoS攻撃</span>
        </div>
        <div class="exp-row">
            <div class="exp-dot" style="background: #38bdf8;"></div>
            <span><b>青（右方向）：</b> 不正アクセスの下見・スキャン</span>
        </div>
        <div class="exp-row">
            <div class="exp-dot" style="background: #10b981;"></div>
            <span><b>緑（左方向）：</b> 日本側からの即時ブロック・応答</span>
        </div>
    </div>

    <!-- テキストラベル描画用レイヤー -->
    <div id="node-labels" class="node-label-container"></div>
</div>

<script>
(function() {
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var logEl = document.getElementById('log');
    var countTotalEl = document.getElementById('count-total');
    var countBlockedEl = document.getElementById('count-blocked');
    var labelContainer = document.getElementById('node-labels');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        updateLabels();
    }
    window.addEventListener('resize', resize);

    // 左側に縦並び配置する「攻撃元の国・地域」
    var sources = [
        { name: "🇨🇳 中国 (主要脅威)", yRatio: 0.18, color: "#ef4444" },
        { name: "🇷🇺 ロシア (攻撃拠点)", yRatio: 0.33, color: "#ef4444" },
        { name: "🇺🇸 米国 (踏み台経由)", yRatio: 0.48, color: "#38bdf8" },
        { name: "🇰🇵 北朝鮮 (外貨狙い)", yRatio: 0.63, color: "#ef4444" },
        { name: "🌎 その他・南米プロキシ", yRatio: 0.78, color: "#94a3b8" }
    ];

    // 右側に配置する「日本の防衛拠点」
    var targets = [
        { name: "🔴 東京 (首都圏・主要IX)", yRatio: 0.25, border: "#ef4444" },
        { name: "🟠 大阪 (関西データセンター)", yRatio: 0.50, border: "#f59e0b" },
        { name: "🔵 福岡 (西日本ゲートウェイ)", yRatio: 0.75, border: "#3b82f6" }
    ];

    var attackTypes = [
        { id: 'scan', name: "不正アクセスの下見", color: "#38bdf8" },
        { id: 'ddos', name: "サーバー破壊攻撃 (DDoS)", color: "#ef4444" },
        { id: 'ping', name: "生存確認通信 (Ping)", color: "#f1f5f9" }
    ];

    var activePackets = [];
    var totalPacketsCount = 0;
    var blockedCount = 0;

    // テキストラベルの初期化・更新
    function updateLabels() {
        labelContainer.innerHTML = '';
        var srcX = canvas.width * 0.36; // 発信元のX位置
        var tgtX = canvas.width * 0.78; // ターゲットのX位置

        // 左側の国リストの描画
        for (var i = 0; i < sources.length; i++) {
            var s = sources[i];
            var div = document.createElement('div');
            div.className = 'node-tag tag-source';
            div.style.left = (srcX - 160) + 'px';
            div.style.top = (canvas.height * s.yRatio) + 'px';
            div.innerText = s.name;
            labelContainer.appendChild(div);
        }

        // 右側の日本拠点の描画
        for (var j = 0; j < targets.length; j++) {
            var t = targets[j];
            var divT = document.createElement('div');
            divT.className = 'node-tag tag-target';
            divT.style.border = '1px solid ' + t.border;
            divT.style.left = (tgtX + 20) + 'px';
            divT.style.top = (canvas.height * t.yRatio) + 'px';
            divT.innerText = t.name;
            labelContainer.appendChild(divT);
        }
    }

    function spawnPacket() {
        var src = sources[Math.floor(Math.random() * sources.length)];
        var target = targets[Math.floor(Math.random() * targets.length)];
        var attack = attackTypes[Math.floor(Math.random() * attackTypes.length)];
        
        totalPacketsCount++;

        var sx = canvas.width * 0.36;
        var sy = canvas.height * src.yRatio;
        var tx = canvas.width * 0.78;
        var ty = canvas.height * target.yRatio;

        // 海外 ➔ 日本への攻撃
        activePackets.push({
            sx: sx, sy: sy, tx: tx, ty: ty,
            progress: 0,
            speed: 0.006 + Math.random() * 0.004,
            color: attack.color,
            isBlocked: false
        });

        // 確率で日本側から即時ブロック・返信（緑）
        if (Math.random() > 0.35) {
            blockedCount++;
            countBlockedEl.innerText = blockedCount.toLocaleString();
            activePackets.push({
                sx: tx, sy: ty, tx: sx, ty: sy,
                progress: 0,
                speed: 0.009 + Math.random() * 0.004,
                color: "#10b981", // 緑のブロック光
                isBlocked: true
            });
        }

        countTotalEl.innerText = totalPacketsCount.toLocaleString();
        logEl.innerHTML = '<b>【' + src.name.split(' ')[0] + '】</b> ➔ <b>' + target.name.split(' ')[0] + '</b><br><span style="color:' + attack.color + '">➔ ' + attack.name + '</span>';
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var srcX = canvas.width * 0.36;
        var tgtX = canvas.width * 0.78;

        // 背景接続ラインの描画
        ctx.lineWidth = 0.5;
        for (var s = 0; s < sources.length; s++) {
            var sy = canvas.height * sources[s].yRatio;
            for (var t = 0; t < targets.length; t++) {
                var ty = canvas.height * targets[t].yRatio;
                ctx.beginPath();
                ctx.moveTo(srcX, sy);
                ctx.lineTo(tgtX, ty);
                ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
                ctx.stroke();
            }
        }

        // 発信元・到達点のノード円
        for (var i = 0; i < sources.length; i++) {
            ctx.beginPath();
            ctx.arc(srcX, canvas.height * sources[i].yRatio, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#334155";
            ctx.fill();
        }
        for (var j = 0; j < targets.length; j++) {
            var ty2 = canvas.height * targets[j].yRatio;
            ctx.beginPath();
            ctx.arc(tgtX, ty2, 10 + (Date.now() / 30) % 20, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(tgtX, ty2, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#ef4444";
            ctx.fill();
        }

        // 移動するパケットの描画
        for (var k = activePackets.length - 1; k >= 0; k--) {
            var p = activePackets[k];
            p.progress += p.speed;

            var curX = p.sx + (p.tx - p.sx) * p.progress;
            // わずかなカーブをつける
            var arcHeight = Math.sin(p.progress * Math.PI) * (p.isBlocked ? 20 : -20);
            var curY = p.sy + (p.ty - p.sy) * p.progress + arcHeight;

            ctx.beginPath();
            ctx.arc(curX, curY, p.isBlocked ? 4 : 5, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.fill();

            if (p.progress >= 1) {
                activePackets.splice(k, 1);
            }
        }
        ctx.shadowBlur = 0;

        requestAnimationFrame(animate);
    }

    resize();
    spawnPacket();
    setInterval(spawnPacket, 550);
    animate();
})();
</script>
</body>
</html>
