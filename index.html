<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Threat Monitor - Japan Target</title>
    <style>
        body {
            margin: 0;
            background-color: #030712;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #svg-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.65;
            pointer-events: none;
        }
        .land {
            fill: #08162b;
            stroke: #00ffcc;
            stroke-width: 0.6;
        }
        .country-label {
            fill: #6080a0;
            font-size: 10px;
            font-family: monospace;
            letter-spacing: 1px;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(3, 11, 24, 0.9);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
            z-index: 10;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #fff;
            text-shadow: 0 0 8px #00ffcc;
        }
        .subtitle {
            font-size: 11px;
            color: #00ffcc;
            margin-bottom: 10px;
        }
        .log-box {
            font-size: 12px;
            color: #a0f0ff;
            max-width: 350px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 正確な大陸のシルエットデータを持つ世界地図SVG -->
    <svg id="svg-map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
        <!-- 背景グリッド線 -->
        <g stroke="#091c33" stroke-width="0.5">
            <line x1="0" y1="125" x2="1000" y2="125" stroke-dasharray="3" />
            <line x1="0" y1="250" x2="1000" y2="250" stroke-dasharray="3" />
            <line x1="0" y1="375" x2="1000" y2="375" stroke-dasharray="3" />
            <line x1="250" y1="0" x2="250" y2="500" stroke-dasharray="3" />
            <line x1="500" y1="0" x2="500" y2="500" stroke-dasharray="3" />
            <line x1="750" y1="0" x2="750" y2="500" stroke-dasharray="3" />
        </g>

        <!-- 本格的な大陸パス -->
        <g class="land">
            <!-- 北米大陸 -->
            <path d="M158,82 L175,70 L205,75 L230,62 L260,78 L278,92 L265,115 L285,130 L275,150 L250,140 L235,165 L245,190 L225,205 L200,185 L180,200 L160,170 L140,175 L125,145 L135,120 L158,82 Z" />
            <!-- 南米大陸 -->
            <path d="M210,250 L240,245 L260,265 L275,300 L260,355 L240,410 L215,435 L200,410 L210,360 L195,320 L205,270 L210,250 Z" />
            <!-- ヨーロッパ -->
            <path d="M470,95 L495,85 L525,90 L540,110 L525,135 L500,140 L475,130 L465,110 L470,95 Z" />
            <!-- アフリカ大陸 -->
            <path d="M475,155 L510,150 L535,170 L555,205 L545,260 L530,325 L505,370 L480,350 L465,290 L455,220 L465,180 L475,155 Z" />
            <!-- ユーラシア・アジア・ロシア大陸 -->
            <path d="M530,60 L620,40 L710,45 L800,55 L880,75 L925,100 L905,145 L850,165 L810,150 L770,175 L710,160 L650,185 L600,155 L565,170 L540,140 L555,110 L530,60 Z" />
            <!-- オーストラリア大陸 -->
            <path d="M800,345 L845,335 L885,350 L890,390 L870,430 L825,435 L795,415 L785,375 L800,345 Z" />
            <!-- 日本列島（ターゲット・強調） -->
            <path id="japan-map" d="M852,142 C858,138 865,148 862,160 C858,172 850,178 845,170 C842,160 847,146 852,142 Z" fill="#ff0055" stroke="#ffffff" stroke-width="1" />
        </g>

        <!-- 地域・ターゲット名 -->
        <text x="838" y="132" class="country-label" fill="#ff0055" font-weight="bold">★ TOKYO (TARGET)</text>
        <text x="160" y="70" class="country-label">NORTH AMERICA</text>
        <text x="480" y="75" class="country-label">EUROPE</text>
        <text x="680" y="38" class="country-label">EURASIA / ASIA</text>
        <text x="465" y="390" class="country-label">AFRICA</text>
        <text x="200" y="455" class="country-label">SOUTH AMERICA</text>
        <text x="795" y="455" class="country-label">AUSTRALIA</text>
    </svg>

    <canvas id="canvas"></canvas>

    <div class="hud">
        <h1>JAPAN CYBER THREAT MONITOR</h1>
        <div class="subtitle">NICTER-Style Real-Time Packet Visualizer</div>
        <div id="log" class="log-box">システム初期化完了。攻撃パケット監視中...</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 日本（東京）の位置座標
const targetJapan = { x: 0.85, y: 0.31, name: "Japan (Tokyo)" };

// 世界各地の攻撃元座標
const sources = [
    { x: 0.18, y: 0.28, name: "USA (West)" },
    { x: 0.25, y: 0.32, name: "USA (East)" },
    { x: 0.49, y: 0.22, name: "Europe (EU)" },
    { x: 0.52, y: 0.48, name: "Africa" },
    { x: 0.72, y: 0.20, name: "China / Asia" },
    { x: 0.82, y: 0.75, name: "Australia" },
    { x: 0.23, y: 0.65, name: "South America" }
];

// NICTER準拠のプロトコル色分け
const protocols = [
    { name: "TCP (Port Scan / Brute Force)", color: "#00ccff" }, // 青
    { name: "UDP (DDoS / Amplification)", color: "#ff3333" },    // 赤
    { name: "ICMP (Ping Probe)", color: "#ffffff" }               // 白
];

let activePackets = [];

function spawnPacket() {
    const src = sources[Math.floor(Math.random() * sources.length)];
    const proto = protocols[Math.floor(Math.random() * protocols.length)];
    
    activePackets.push({
        sx: src.x * canvas.width,
        sy: src.y * canvas.height,
        tx: targetJapan.x * canvas.width,
        ty: targetJapan.y * canvas.height,
        progress: 0,
        speed: 0.007 + Math.random() * 0.01,
        color: proto.color,
        protoName: proto.name,
        sourceName: src.name
    });

    logEl.innerHTML = `<span style="color:${proto.color}">[${proto.protoName.split(' ')[0]}]</span> Attack from <b style="color:#fff">${src.name}</b>`;
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 東京（ターゲット）のレーダー円パルス
    const tx = targetJapan.x * canvas.width;
    const ty = targetJapan.y * canvas.height;
    
    ctx.beginPath();
    ctx.arc(tx, ty, 10 + (Date.now() / 25) % 25, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 0, 85, 0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // パケットの軌道描画
    for (let i = activePackets.length - 1; i >= 0; i--) {
        const p = activePackets[i];
        p.progress += p.speed;

        const curX = p.sx + (p.tx - p.sx) * p.progress;
        const arcHeight = Math.sin(p.progress * Math.PI) * -110;
        const curY = p.sy + (p.ty - p.sy) * p.progress + arcHeight;

        ctx.beginPath();
        ctx.arc(curX, curY, 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();

        if (p.progress >= 1) {
            activePackets.splice(i, 1);
        }
    }
    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

setInterval(spawnPacket, 400);
animate();
</script>
</body>
</html>
