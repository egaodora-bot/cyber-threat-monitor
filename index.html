        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        /* 地図を表示するエリア */
        #map {
            position: absolute;
            top: 0;
            left: 0;

            z-index: 1;
            background: #020617;
        }
        /* Leafletのダークテーマ調整（サイバー風にするため） */
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
        }

        /* 攻撃アニメーション用キャンバス */
        #anim-canvas {
            position: absolute;
            top: 0;
            left: 0;

            height: 100%;
            z-index: 2;
            pointer-events: none;

            color: #f8fafc;
