<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Threat Monitor - Japan Target</title>
    <style>
        body {
            margin: 0;
            background-color: #050b14;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        /* 世界地図SVGのスタイル */
        #svg-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.5;
            pointer-events: none;
        }
        .land {
            fill: #0a192f;
            stroke: #00ffcc;
            stroke-width: 0.8;
        }
        .country-label {
            fill: #88aacc;
            font-size: 10px;
            font-family: monospace;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(5, 15, 30, 0.9);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            z-index: 10;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 8px #00ffcc;
        }
        .subtitle {
            font-size: 11px;
            color: #00ffcc;
            margin-bottom: 10px;
        }
        .log-box {
            font-size: 12px;
            color: #a0f0ff;
            max-width: 350px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 視認性を高めた世界地図SVG -->
    <svg id="svg-map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
        <!-- グリッド線（レーダー風） -->
        <g stroke="#0e2a47" stroke-width="0.5">
            <line x1="0" y1="125" x2="1000" y2="125" stroke-dasharray="4" />
            <line x1="0" y1="250" x2="1000" y2="250" stroke-dasharray="4" />
            <line x1="0" y1="375" x2="1000" y2="375" stroke-dasharray="4" />
            <line x1="250" y1="0" x2="250" y2="500" stroke-dasharray="4" />
            <line x1="500" y1="0" x2="500" y2="500" stroke-dasharray="4" />
            <line x1="750" y1="0" x2="750" y2="500" stroke-dasharray="4" />
        </g>

        <!-- 各大陸のシルエット -->
        <g class="land">
            <!-- 北米 -->
            <path d="M 120,80 Q 180,60 230,90 Q 270,140 220,180 Q 150,200 130,150 Z" />
            <!-- 南米 -->
            <path d="M 220,220 Q 280,240 260,350 Q 230,420 200,380 Q 190,300 210,240 Z" />
            <!-- 欧州 -->
            <path d="M 450,90 Q 520,70 550,110 Q 510,150 460,140 Z" />
            <!-- アフリカ -->
            <path d="M 470,160 Q 560,170 540,280 Q 500,380 460,320 Q 430,240 460,170 Z" />
            <!-- アジア・ロシア -->
            <path d="M 560,50 Q 750,30 900,70 Q 920,160 820,200 Q 700,220 580,160 Z" />
            <!-- オーストラリア -->
            <path d="M 800,340 Q 890,330 870,420 Q 790,430 790,360 Z" />
            <!-- 日本列島（ターゲット） -->
            <path id="japan-map" d="M 830,140 Q 845,130 855,165 Q 840,180 830,140 Z" fill="#ff0055" stroke="#fff" stroke-width="1" />
        </g>

        <!-- 主要拠点ラベル -->
        <text x="830" y="130" class="country-label" fill="#ff0055" font-weight="bold">★ TOKYO (TARGET)</text>
        <text x="200" y="100" class="country-label">NORTH AMERICA</text>
        <text x="500" y="80" class="country-label">EUROPE</text>
        <text x="750" y="100" class="country-label">ASIA</text>
    </svg>

    <canvas id="canvas"></canvas>

    <div class="hud">
        <h1>JAPAN CYBER THREAT MONITOR</h1>
        <div class="subtitle">NICTER-Style Real-Time Packet Visualizer</div>
        <div id="log" class="log-box">システム初期化完了。攻撃パケット監視中...</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 日本（東京）の画面上の位置比率
const targetJapan = { x: 0.84, y: 0.32, name: "Japan (Tokyo)" };

// 世界各地の攻撃発生元
const sources = [
    { x: 0.18, y: 0.28, name: "USA (West)" },
    { x: 0.24, y: 0.32, name: "USA (East)" },
    { x: 0.49, y: 0.22, name: "Europe (EU)" },
    { x: 0.52, y: 0.45, name: "Africa" },
    { x: 0.72, y: 0.25, name: "China / Asia" },
    { x: 0.80, y: 0.72, name: "Australia" },
    { x: 0.23, y: 0.65, name: "South America" }
];

// NICTER準拠のプロトコル（色分け）
const protocols = [
    { name: "TCP (Port Scan / Brute Force)", color: "#00ccff" }, // 青
    { name: "UDP (DDoS / Amplification)", color: "#ff3333" },    // 赤
    { name: "ICMP (Ping Probe)", color: "#ffffff" }               // 白
];

let activePackets = [];

function spawnPacket() {
    const src = sources[Math.floor(Math.random() * sources.length)];
    const proto = protocols[Math.floor(Math.random() * protocols.length)];
    
    activePackets.push({
        sx: src.x * canvas.width,
        sy: src.y * canvas.height,
        tx: targetJapan.x * canvas.width,
        ty: targetJapan.y * canvas.height,
        progress: 0,
        speed: 0.007 + Math.random() * 0.01,
        color: proto.color,
        protoName: proto.name,
        sourceName: src.name
    });

    logEl.innerHTML = `<span style="color:${proto.color}">[${proto.protoName.split(' ')[0]}]</span> Attack from <b style="color:#fff">${src.name}</b>`;
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ターゲット（日本・東京）のレーダー円パルス
    const tx = targetJapan.x * canvas.width;
    const ty = targetJapan.y * canvas.height;
    
    ctx.beginPath();
    ctx.arc(tx, ty, 12 + (Date.now() / 20) % 20, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 0, 85, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 攻撃パケットの描画
    for (let i = activePackets.length - 1; i >= 0; i--) {
        const p = activePackets[i];
        p.progress += p.speed;

        // 弧を描く軌道計算
        const curX = p.sx + (p.tx - p.sx) * p.progress;
        const arcHeight = Math.sin(p.progress * Math.PI) * -100;
        const curY = p.sy + (p.ty - p.sy) * p.progress + arcHeight;

        // 軌跡の光る点
        ctx.beginPath();
        ctx.arc(curX, curY, 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();

        if (p.progress >= 1) {
            activePackets.splice(i, 1);
        }
    }
    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

setInterval(spawnPacket, 400);
animate();
</script>
</body>
</html>
