<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Threat Monitor - Japan Target</title>
    <style>
        body {
            margin: 0;
            background-color: #030712;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #svg-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.6;
            pointer-events: none;
        }
        .land {
            fill: #0a1f35;
            stroke: #00ffcc;
            stroke-width: 0.8;
        }
        .country-label {
            fill: #7090b0;
            font-size: 11px;
            font-family: monospace;
            letter-spacing: 1px;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(3, 11, 24, 0.9);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
            z-index: 10;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #fff;
            text-shadow: 0 0 8px #00ffcc;
        }
        .subtitle {
            font-size: 11px;
            color: #00ffcc;
            margin-bottom: 10px;
        }
        .log-box {
            font-size: 12px;
            color: #a0f0ff;
            max-width: 350px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 自然な世界地図のSVGパス -->
    <svg id="svg-map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
        <!-- グリッド線 -->
        <g stroke="#0c233f" stroke-width="0.5">
            <line x1="0" y1="125" x2="1000" y2="125" stroke-dasharray="3" />
            <line x1="0" y1="250" x2="1000" y2="250" stroke-dasharray="3" />
            <line x1="0" y1="375" x2="1000" y2="375" stroke-dasharray="3" />
            <line x1="250" y1="0" x2="250" y2="500" stroke-dasharray="3" />
            <line x1="500" y1="0" x2="500" y2="500" stroke-dasharray="3" />
            <line x1="750" y1="0" x2="750" y2="500" stroke-dasharray="3" />
        </g>

        <!-- 各大陸・国々の輪郭 -->
        <g class="land">
            <!-- 北米大陸 -->
            <path d="M 120,90 C 140,75 180,60 220,65 C 260,70 280,90 270,120 C 260,150 230,170 240,200 C 245,215 220,240 200,230 C 170,215 150,180 135,160 C 120,140 110,110 120,90 Z" />
            <!-- 南米大陸 -->
            <path d="M 215,250 C 240,245 265,260 275,290 C 285,320 265,370 250,410 C 235,445 220,430 210,390 C 200,340 195,300 205,270 C 208,258 212,252 215,250 Z" />
            <!-- ヨーロッパ -->
            <path d="M 460,95 C 480,85 520,80 545,95 C 560,105 550,130 530,140 C 500,150 475,135 460,120 C 455,110 455,100 460,95 Z" />
            <!-- アフリカ大陸 -->
            <path d="M 470,160 C 510,155 540,170 555,200 C 570,230 550,290 535,330 C 520,370 490,380 475,340 C 455,290 445,210 455,185 C 460,170 465,162 470,160 Z" />
            <!-- アジア大陸・ロシア -->
            <path d="M 550,60 C 650,40 780,45 880,75 C 930,90 920,150 880,180 C 830,215 720,230 650,210 C 590,195 565,150 555,120 C 550,95 545,75 550,60 Z" />
            <!-- オーストラリア大陸 -->
            <path d="M 800,330 C 850,320 890,340 895,380 C 900,420 860,440 815,435 C 785,430 780,390 785,360 C 790,340 795,332 800,330 Z" />
            <!-- 日本列島（ターゲット・強調表示） -->
            <path id="japan-map" d="M 855,135 C 865,130 872,145 868,165 C 862,185 850,190 845,175 C 842,160 848,140 855,135 Z" fill="#ff0055" stroke="#ffffff" stroke-width="1.2" />
        </g>

        <!-- ラベル配置 -->
        <text x="835" y="120" class="country-label" fill="#ff0055" font-weight="bold">★ TOKYO (TARGET)</text>
        <text x="160" y="80" class="country-label">NORTH AMERICA</text>
        <text x="480" y="75" class="country-label">EUROPE</text>
        <text x="680" y="60" class="country-label">EURASIA / ASIA</text>
        <text x="460" y="410" class="country-label">AFRICA</text>
        <text x="210" y="460" class="country-label">SOUTH AMERICA</text>
        <text x="800" y="460" class="country-label">AUSTRALIA</text>
    </svg>

    <canvas id="canvas"></canvas>

    <div class="hud">
        <h1>JAPAN CYBER THREAT MONITOR</h1>
        <div class="subtitle">NICTER-Style Real-Time Packet Visualizer</div>
        <div id="log" class="log-box">システム初期化完了。攻撃パケット監視中...</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 日本（東京）の座標位置
const targetJapan = { x: 0.85, y: 0.31, name: "Japan (Tokyo)" };

// 世界各地の攻撃元
const sources = [
    { x: 0.18, y: 0.28, name: "USA (West)" },
    { x: 0.25, y: 0.32, name: "USA (East)" },
    { x: 0.49, y: 0.22, name: "Europe (EU)" },
    { x: 0.52, y: 0.48, name: "Africa" },
    { x: 0.72, y: 0.20, name: "China / Asia" },
    { x: 0.82, y: 0.75, name: "Australia" },
    { x: 0.23, y: 0.65, name: "South America" }
];

// NICTER準拠のプロトコル色分け
const protocols = [
    { name: "TCP (Port Scan / Brute Force)", color: "#00ccff" }, // 青
    { name: "UDP (DDoS / Amplification)", color: "#ff3333" },    // 赤
    { name: "ICMP (Ping Probe)", color: "#ffffff" }               // 白
];

let activePackets = [];

function spawnPacket() {
    const src = sources[Math.floor(Math.random() * sources.length)];
    const proto = protocols[Math.floor(Math.random() * protocols.length)];
    
    activePackets.push({
        sx: src.x * canvas.width,
        sy: src.y * canvas.height,
        tx: targetJapan.x * canvas.width,
        ty: targetJapan.y * canvas.height,
        progress: 0,
        speed: 0.007 + Math.random() * 0.01,
        color: proto.color,
        protoName: proto.name,
        sourceName: src.name
    });

    logEl.innerHTML = `<span style="color:${proto.color}">[${proto.protoName.split(' ')[0]}]</span> Attack from <b style="color:#fff">${src.name}</b>`;
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 東京（ターゲット）のレーダー円パルス
    const tx = targetJapan.x * canvas.width;
    const ty = targetJapan.y * canvas.height;
    
    ctx.beginPath();
    ctx.arc(tx, ty, 10 + (Date.now() / 25) % 25, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 0, 85, 0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 攻撃パケットの描画
    for (let i = activePackets.length - 1; i >= 0; i--) {
        const p = activePackets[i];
        p.progress += p.speed;

        const curX = p.sx + (p.tx - p.sx) * p.progress;
        const arcHeight = Math.sin(p.progress * Math.PI) * -110;
        const curY = p.sy + (p.ty - p.sy) * p.progress + arcHeight;

        ctx.beginPath();
        ctx.arc(curX, curY, 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();

        if (p.progress >= 1) {
            activePackets.splice(i, 1);
        }
    }
    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

setInterval(spawnPacket, 400);
animate();
</script>
</body>
</html>
